[package]
name = "agent-board-client"
version = "0.2.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
open = "5"
reqwest = { version = "0.13", default-features = false, features = ["native-tls-no-alpn"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Before 2.11.1 a remote page could invoke every app command when no app manifest was declared.
# Exact pin: the multi-webview API behind "unstable" may change in a minor release.
tauri = { version = "=2.12.6", features = ["unstable"] }
tokio = { version = "1", features = ["sync", "time"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6", default-features = false, features = ["std"] }
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSDictionary", "NSError", "NSObject", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
