[package]
name = "agent-board-client"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Before 2.11.1 a remote page could invoke every app command when no app manifest was declared.
tauri = { version = "2.12", features = [] }
tokio = { version = "1", features = ["time"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
