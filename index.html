<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Agent Board</title>
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true" focusable="false" class="sprite">
      <symbol id="i-error" viewBox="0 0 16 16">
        <circle cx="8" cy="8" r="6.75" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path
          d="M8 4.6v4.1M8 11v.4"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
      </symbol>
      <symbol id="i-ok" viewBox="0 0 16 16">
        <circle cx="8" cy="8" r="6.75" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path
          d="M5.2 8.3l1.9 1.9 3.8-4.2"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="i-more" viewBox="0 0 16 16">
        <circle cx="3.5" cy="8" r="1.4" fill="currentColor" />
        <circle cx="8" cy="8" r="1.4" fill="currentColor" />
        <circle cx="12.5" cy="8" r="1.4" fill="currentColor" />
      </symbol>
    </svg>

    <header class="app-head">
      <div class="app-bar">
        <h1>Servers <small id="count"></small></h1>
        <button type="button" class="primary" id="add-trigger" data-key="add-trigger">
          Add server
        </button>
      </div>
      <ul id="panel" class="panel" hidden></ul>
    </header>

    <main>
      <ul id="servers" class="servers"></ul>
      <p id="empty" class="empty" hidden>
        No servers yet. Use Add server to add the address of a board.
      </p>
    </main>

    <dialog id="add-sheet" aria-labelledby="add-title">
      <form class="sheet" novalidate>
        <h2 id="add-title">Add a server</h2>
        <label>
          <span>Name</span>
          <input
            id="server-name"
            name="name"
            type="text"
            autocomplete="off"
            aria-describedby="name-message"
          />
        </label>
        <p id="name-message" class="field-message"></p>
        <label>
          <span>Address</span>
          <input
            id="server-url"
            name="url"
            type="url"
            inputmode="url"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="https://board.example.com"
            aria-describedby="url-message"
          />
        </label>
        <p id="url-message" class="field-message"></p>
        <p id="sheet-status" class="sheet-status" role="status"></p>
        <div class="sheet-actions">
          <button type="button" class="quiet" id="sheet-cancel">Cancel</button>
          <button type="button" id="sheet-test">Test</button>
          <button type="submit" class="primary" id="sheet-add">Add server</button>
        </div>
      </form>
    </dialog>

    <p id="live" class="sr-only" aria-live="polite"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
